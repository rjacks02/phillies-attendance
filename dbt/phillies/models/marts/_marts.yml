version: 2

models:
  - name: fct_home_games
    description: >
      One row per Phillies home ticketed event, 2015-2025 excluding 2020-2021.
      Single-admission doubleheaders are kept as one row (game 2, which carries the attendance).
    columns:
      - name: game_id
        data_tests: [unique, not_null]
      - name: game_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: opponent
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_opponent')
                field: opponent
      - name: attendance
        data_tests: [not_null]

  - name: dim_opponent
    columns:
      - name: opponent
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

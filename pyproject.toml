[project]
name = "phillies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rebecca Jackson", email = "rjacks02@villanova.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-postgres>=1.11.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas<3",
    "psycopg[binary]>=3.3.9",
    "pybaseball>=2.2.7",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
phillies = "phillies:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
